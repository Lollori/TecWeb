  <script>(function(){var t=localStorage.getItem('theme');if(!t){t='dark';localStorage.setItem('theme',t);}document.documentElement.dataset.theme=t;})();</script>
  <script>(function(){
    // Safari mobile ridimensiona la viewport mostrando/nascondendo la barra
    // degli indirizzi durante lo scroll. window.visualViewport.height NON
    // segue in modo affidabile questo cambiamento (resta ancorato al valore
    // "barra visibile", più piccolo): per questo il tentativo precedente,
    // basato su visualViewport, teneva la shell più bassa del reale. La
    // tecnica storicamente affidabile è ricalcolare da window.innerHeight,
    // che invece SI aggiorna quando la barra collassa/riappare.
    function setAppVh() {
      document.documentElement.style.setProperty('--app-vh', window.innerHeight + 'px');
    }
    setAppVh();
    window.addEventListener('resize', setAppVh);
    window.addEventListener('orientationchange', setAppVh);
    window.addEventListener('scroll', setAppVh, { passive: true });
  })();</script>
</head>
